name: release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        registry:
          [
            {
              enabled: true,
              public: false,
              url: "https://npm.pkg.github.com",
              token: GITHUB_TOKEN,
            },
            { enabled: false, public: true, url: "https://registry.npmjs.org", token: NPM_TOKEN },
          ]
      fail-fast: false
    steps:
      # `run: exit 0` only ends its own step, so every step carries the guard.
      - uses: actions/checkout@v6
        if: matrix.registry.enabled
      - uses: voidzero-dev/setup-vp@v1.17.0
        if: matrix.registry.enabled
        with:
          node-version: "24"
      # setup-vp does not write registry credentials the way actions/setup-node did.
      - name: Configure registry auth
        if: matrix.registry.enabled
        run: |
          host="${REGISTRY_URL#https:}"
          {
            echo "@let-value:registry=${REGISTRY_URL}"
            echo "${host%/}/:_authToken=\${NODE_AUTH_TOKEN}"
          } > .npmrc
        env:
          REGISTRY_URL: ${{ matrix.registry.url }}
      - run: vp pm ci
        if: matrix.registry.enabled
      - run: vp run build
        if: matrix.registry.enabled
      - name: Resolve publish tag and publish
        if: matrix.registry.enabled
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" == *-* ]]; then
            TAG="next"
          else
            TAG="latest"
          fi

          vp pm publish --tag "$TAG" --access "$ACCESS" --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets[matrix.registry.token] }}
          ACCESS: ${{ matrix.registry.public && 'public' || 'restricted' }}
